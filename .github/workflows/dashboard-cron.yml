name: Dashboard Alerts Cron

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  # Lets you trigger the job manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Load .env into runner
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            key="${line%%=*}"
            val="${line#*=}"
            key="$(echo "$key" | xargs)"
            val="${val%\"}"
            val="${val#\"}"
            val="${val%\'}"
            val="${val#\'}"
            export "${key}=${val}"
            echo "${key}=${val}" >> "$GITHUB_ENV"
          done < .env
          rm -f .env

          echo "APP_URL=${APP_URL%/}" >> "$GITHUB_ENV"

      - name: Call Vercel Cron Endpoint
        run: |
          curl --fail -sS -X GET "${APP_URL}/v1/cron/dashboard-alerts" \
            -H "Authorization: Bearer ${CRON_SECRET}"
