name: Daily Postgres Backup to R2

on:
  schedule:
    - cron: '30 20 * * *' # Runs daily at 2:00 AM IST
  workflow_dispatch:       # Lets you trigger a manual backup anytime

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Load .env into runner
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            key="${line%%=*}"
            val="${line#*=}"
            key="$(echo "$key" | xargs)"
            val="${val%\"}"
            val="${val#\"}"
            val="${val%\'}"
            val="${val#\'}"
            export "${key}=${val}"
            echo "${key}=${val}" >> "$GITHUB_ENV"
          done < .env
          rm -f .env

          {
            echo "PGHOST=$POSTGRES_HOST"
            echo "PGPORT=${POSTGRES_PORT:-5432}"
            echo "PGUSER=$POSTGRES_USER"
            echo "PGPASSWORD=$POSTGRES_PASSWORD"
            echo "PGDATABASE=$POSTGRES_DB"
            echo "PGSSLMODE=${POSTGRES_SSLMODE:-require}"
            echo "AWS_ACCESS_KEY_ID=$STORAGE_ACCESS_KEY"
            echo "AWS_SECRET_ACCESS_KEY=$STORAGE_SECRET_KEY"
            echo "AWS_DEFAULT_REGION=${STORAGE_REGION:-auto}"
          } >> "$GITHUB_ENV"

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        run: |
          FILENAME="backup-$(date +%Y-%m-%d_%H-%M-%S).dump"
          pg_dump --format=custom --no-owner --no-acl -f "$FILENAME"
          echo "BACKUP_FILE=$FILENAME" >> "$GITHUB_ENV"

      - name: Upload to Cloudflare R2
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://${STORAGE_BUCKET}/db-backups/$BACKUP_FILE" \
            --endpoint-url "${STORAGE_ENDPOINT}"
