name: Reports Archive Cron

on:
  schedule:
    # Runs daily at 5:00 AM IST (23:30 UTC)
    - cron: '30 23 * * *'

  workflow_dispatch:

jobs:
  reports-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Load .env into runner
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            key="${line%%=*}"
            val="${line#*=}"
            key="$(echo "$key" | xargs)"
            val="${val%\"}"
            val="${val#\"}"
            val="${val%\'}"
            val="${val#\'}"
            export "${key}=${val}"
            echo "${key}=${val}" >> "$GITHUB_ENV"
          done < .env
          rm -f .env

          echo "APP_URL=${APP_URL%/}" >> "$GITHUB_ENV"

      - name: Generate Monthly Reports
        run: |
          curl --fail -sS -X GET "${APP_URL}/v1/cron/monthly-reports" \
            -H "Authorization: Bearer ${CRON_SECRET}"

      - name: Send Report Expiration Reminders
        run: |
          curl --fail -sS -X GET "${APP_URL}/v1/cron/report-expiration-reminders" \
            -H "Authorization: Bearer ${CRON_SECRET}"

      - name: Delete Expired Reports
        run: |
          curl --fail -sS -X GET "${APP_URL}/v1/cron/expired-reports" \
            -H "Authorization: Bearer ${CRON_SECRET}"
