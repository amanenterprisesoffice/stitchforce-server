name: Reports Archive Cron

on:
  schedule:
    # Runs daily at 5:00 AM IST (23:30 UTC)
    - cron: '30 23 * * *'

  workflow_dispatch:

jobs:
  reports-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Monthly Reports
        run: |
          curl --fail -sS -X GET "${{ secrets.APP_URL }}/v1/cron/monthly-reports" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Send Report Expiration Reminders
        run: |
          curl --fail -sS -X GET "${{ secrets.APP_URL }}/v1/cron/report-expiration-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Delete Expired Reports
        run: |
          curl --fail -sS -X GET "${{ secrets.APP_URL }}/v1/cron/expired-reports" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"