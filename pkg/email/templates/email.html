
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
</head>
<body style="margin:0;padding:30px 12px;background:#f4f4f5;
             font-family:Arial,sans-serif;color:#18181b;">

  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0"
               style="max-width:560px;background:#ffffff;
                      border-radius:10px;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="padding:24px 30px;background:#18181b;">
              <h2 style="margin:0;color:#ffffff;">
                StitchForce
              </h2>
            </td>
          </tr>

          <!-- Dynamic content -->
          <tr>
            <td style="padding:32px 30px;">
              {{.Body}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:22px 30px;background:#fafafa;
                       border-top:1px solid #eeeeee;
                       font-size:12px;color:#71717a;">

              <p style="margin:0 0 8px;">
                © 2026 StitchForce. All rights reserved.
              </p>

              <p style="margin:0;">
                <a href="https://yadavaman.com"
                   style="color:#71717a;">
                  yadavaman.com
                </a>
                &nbsp;|&nbsp;
               <a href="mailto:{{.SupportEmail}}" style="color:#71717a;">
                Contact Support
              </a>
              </p>

            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
